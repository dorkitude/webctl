version: 2
project_name: webctl

before:
  hooks:
    - go mod tidy

builds:
  - id: webctl
    main: ./cmd/webctl
    binary: webctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dorkitude/webctl/cmd/webctl/cli.version={{ .Version }}

# One macOS binary for Apple Silicon and Intel (webctl_X_darwin_all.tar.gz),
# which the Homebrew cask installs. The per-arch darwin archives stay for npm.
universal_binaries:
  - id: webctl
    ids: [webctl]
    replace: false

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple (runs on Linux via quill). Skipped when the secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [webctl]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: webctl
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Kyle Wild
    homepage: https://github.com/dorkitude/webctl
    maintainer: Kyle Wild <kyle@kylewild.com>
    description: Smart web search CLI for agents, backed by Jev. Saves a lot of tokens.
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    section: utils
    priority: optional

homebrew_casks:
  - name: webctl
    repository:
      owner: dorkitude
      name: homebrew-webctl
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/dorkitude/webctl
    description: Smart web search CLI for agents, backed by Jev. Saves a lot of tokens.
    license: MIT
    commit_author:
      name: goreleaser
      email: kyle@kylewild.com
    # The macOS binary is signed and notarized, so the cask needs no
    # quarantine workaround (the old postflight hook is deprecated).

release:
  github:
    owner: dorkitude
    name: webctl
  draft: false

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^ci:"]
